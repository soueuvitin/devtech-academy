<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTech Academy - Exercício 3</title>
</head>

<body>
    <h2>DevTech Academy - Cadastro de Alunos</h2>

    <h3 id="titulo-formulario">Cadastrar Aluno</h3>

    <label for="nome">Nome:</label><br>
    <input type="text" id="nome" placeholder="Nome do aluno"><br><br>

    <label for="idade">Idade:</label><br>
    <input type="number" id="idade" placeholder="Idade" min="1"><br><br>

    <label for="curso">Curso:</label><br>
    <select id="curso">
        <option value="">-- Selecione --</option>
        <option value="JavaScript">JavaScript</option>
        <option value="Python">Python</option>
        <option value="Java">Java</option>
    </select><br><br>

    <label for="nota-final">Nota Final:</label><br>
    <input type="number" id="nota-final" placeholder="0 a 10" min="0" max="10" step="0.1"><br><br>

    <button id="botao-cadastrar">Cadastrar</button>
    <button id="botao-cancelar">Cancelar</button>

    <h3>Alunos Cadastrados</h3>
    <table border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Curso</th>
                <th>Nota Final</th>
                <th>Situação</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela-alunos"></tbody>
    </table>

    <script src="js/Aluno.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
