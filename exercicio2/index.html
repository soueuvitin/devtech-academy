<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTech Academy - Exercício 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="../">DevTech Academy</a>
            <span class="navbar-text">Exercício 2</span>
        </div>
    </nav>

    <div class="container mb-5">
        <h1 class="h3 mb-4">Uso de Classe com Atributos, Construtor e Métodos</h1>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h2 id="titulo-formulario" class="h5 mb-0">Cadastrar Aluno</h2>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" id="nome" class="form-control" placeholder="Nome do aluno">
                        </div>

                        <div class="mb-3">
                            <label for="idade" class="form-label">Idade</label>
                            <input type="number" id="idade" class="form-control" placeholder="Idade" min="1">
                        </div>

                        <div class="mb-3">
                            <label for="curso" class="form-label">Curso</label>
                            <select id="curso" class="form-select">
                                <option value="">-- Selecione --</option>
                                <option value="JavaScript">JavaScript</option>
                                <option value="Python">Python</option>
                                <option value="Java">Java</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="nota-final" class="form-label">Nota Final</label>
                            <input type="number" id="nota-final" class="form-control" placeholder="0 a 10" min="0" max="10" step="0.1">
                        </div>

                        <div class="d-flex gap-2">
                            <button id="botao-cadastrar" class="btn btn-primary" onclick="cadastrarAluno()">Cadastrar</button>
                            <button id="botao-cancelar" class="btn btn-outline-secondary" onclick="limparFormulario()">Cancelar</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h2 class="h5 mb-0">Alunos Cadastrados</h2>
                    </div>
                    <div class="card-body table-responsive">
                        <table class="table table-striped table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>Nome</th>
                                    <th>Idade</th>
                                    <th>Curso</th>
                                    <th>Nota Final</th>
                                <th>Situação</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-alunos"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/Aluno.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
